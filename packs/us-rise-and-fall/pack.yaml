# Niche pack: US Rise & Fall
# Everything the engine knows about this channel lives in this folder.
# To launch a new niche, copy this folder, rename it, and edit these files.

pack: us-rise-and-fall
channel_name: "Built & Broken"   # working name; change any time
language: en-US

video:
  target_words: 2000          # ~13-14 minutes at the pace below
  min_words: 1700
  max_words: 2600
  words_per_minute: 150
  resolution: [1920, 1080]
  fps: 30
  chapters_min: 5
  chapters_max: 8
  # Sentence subtitles burned into the long video, following the narration.
  subtitles: {font: "Montserrat-VariableFont_wght.ttf", size: 36, weight: 600, color: "#F39C2B", y: 1010}

shorts:
  # Vertical Shorts cut from a finished long video's research (de shorts <id>).
  per_video: 3
  target_words: 135            # ~50 seconds of narration
  min_words: 105
  max_words: 160
  max_seconds: 59
  rehook_gap_words: 30         # a new number, turn or reveal every ~8 seconds
  resolution: [1080, 1920]
  fps: 30
  max_beat_words: 10           # a new shot every ~3 seconds
  max_clip_seconds: 3.2
  min_clip_seconds: 1.6
  captions: {font: "Montserrat-VariableFont_wght.ttf", size: 92, y: 1340, fps: 15}
  hook_text_seconds: 3.0
  end_tail_seconds: 0.35       # end on the last word: dead air lowers watch time

topics:
  # The channel's single promise. Every topic must fit it.
  promise: "The rise and fall of America's great builds and businesses"
  categories:
    business: "American companies, industries, brands and fortunes that rose and collapsed"
    megaproject: "American engineering megaprojects, infrastructure and boomtowns"
  mix: {business: 0.6, megaproject: 0.4}
  era: {start: 1850, end: 1985}   # footage coverage is strongest 1930-1980
  must_have:
    - "A clear rise, peak and fall (or near-fall) arc"
    - "At least one named person driving the story"
    - "Hard numbers: money, size, people, dates"
    - "Something that remains, or vanished, today"
  avoid:
    - "Stories set mainly after 1990 (no public-domain footage exists)"
    - "War-centred or atrocity-centred stories (limited-ads risk)"
    - "Living private individuals as the focus"
    - "Topics already covered by this channel"

research:
  wikipedia: true
  chronicling_america: true      # Library of Congress historic newspapers (pre-1964)
  web_search: true               # Claude web search during research
  max_newspaper_pages: 12

footage:
  # archive.org collections searched for footage. Items are accepted when
  # their licence is public domain / CC0 / CC-BY(-SA), or when the collection
  # is marked trusted (US federal works, 17 U.S.C. 105). NC and ND licences
  # are always rejected.
  collections:
    - {id: prelinger, trusted: false, note: "Prelinger Archives: industrial, corporate, educational films"}
    - {id: FedFlix, trusted: true, note: "US federal government films (same source as destockd.com)"}
  destockd: true                 # search destockd.com's shot-level index of FedFlix first
  min_clip_seconds: 3
  max_clip_seconds: 9
  skip_head_fraction: 0.08       # avoid title cards at the start of a film
  skip_tail_fraction: 0.08       # avoid end credits
  candidates_per_beat: 4
  # Never acceptable in any shot. The archives are full of war films, so this
  # list is applied to every beat on top of the beat's own avoid list.
  avoid:
    - "soldiers, military uniforms, weapons or war damage"
    - "famous politicians, leaders or recognisable public figures"
    - "title cards, intertitles, credits, readable signs, labels or brand logos"
    - "cartoons or animation"
    - "colour footage or modern scenes"
    - "funerals, cemeteries, injuries or first-aid scenes"
    - "car stunts, explosions or other spectacle unrelated to the line"
  min_brightness: 38             # frames darker than this are skipped before review
  max_brightness: 215            # ...and brighter than this (blown out)
  min_contrast: 22               # ...and flatter than this (washed out)
  auto_reshoot_rounds: 2         # shotcheck searches again for failed shots this many times
  grade: "bw"                    # bw | vintage | neutral
  fit: "fill"                    # fill: crop 4:3 film to fill 16:9 | blur: show it whole over a blurred copy
  backdrop_cards: true           # number and quote beats get footage too, with their text laid over it
  strip_source_audio: true       # always true: avoids audio Content ID claims

audio:
  music_dir: music               # packs/us-rise-and-fall/music/*.mp3 (royalty-free)
  music_volume_db: -24
  target_lufs: -14

voice:
  stability: 0.45
  similarity_boost: 0.8
  style: 0.15
  speed: 1.0

packaging:
  # de trends studies what makes people click, across niches, and turns it
  # into title formulas and thumbnail patterns for this channel.
  # Handles are editable; de trends reports any it cannot find.
  reference_channels:        # cross-niche packaging leaders
    - "@MrBeast"
    - "@ryan"                 # Ryan Trahan
    - "@MarkRober"
    - "@veritasium"
    - "@kurzgesagt"
    - "@johnnyharris"
    - "@LEMMiNO"
    - "@OverSimplified"
    - "@TomScottGo"
  niche_channels:            # our own space: business, engineering, history, decline
    - "@MagnatesMedia"
    - "@HowMoneyWorks"
    - "@companyman"
    - "@BusinessCasual"
    - "@ColdFusion"
    - "@ModernMBA"
    - "@LogicallyAnswered"
    - "@Wendoverproductions"
    - "@RealEngineering"
    - "@PracticalEngineeringChannel"
    - "@BrightSunFilms"
    - "@Defunctland"
    - "@SimpleHistory"
    - "@WeirdHistory"
  videos_per_channel: 60
  min_outlier: 2.0           # a video must do at least 2x its channel's median
  max_thumbnails_studied: 48
  refresh_days: 14           # de trends warns when the library is older than this
  titles_generated: 24
  titles_kept: 6
  thumbnail_variants: 3      # YouTube Test & Compare allows up to 3

package:
  footer: "Narrated with a synthetic voice from a script researched, fact-checked and reviewed by the channel."

thumbnail:
  text_max_words: 4
  font: "DejaVuSans-Bold.ttf"
  colors: {text: "#FFFFFF", stroke: "#000000", accent: "#E8B33A"}
